DFINE:
  backbone: HGNetv2
  decoder: DFINETransformer
  encoder: HybridEncoder
DFINECriterion:
  alpha: 0.75
  gamma: 2.0
  losses:
  - vfl
  - boxes
  - local
  matcher:
    alpha: 0.25
    gamma: 2.0
    type: HungarianMatcher
    weight_dict:
      cost_bbox: 5
      cost_class: 2
      cost_giou: 2
  reg_max: 32
  weight_dict:
    loss_bbox: 5
    loss_ddf: 1.5
    loss_fgl: 0.15
    loss_giou: 2
    loss_vfl: 1
DFINEPostProcessor:
  num_top_queries: 300
DFINETransformer:
  box_noise_scale: 1.0
  cross_attn_method: default
  eval_idx: -1
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  label_noise_ratio: 0.5
  layer_scale: 1
  num_denoising: 100
  num_layers: 3
  num_levels: 3
  num_points:
  - 3
  - 6
  - 3
  num_queries: 300
  query_select_method: default
  reg_max: 32
  reg_scale: 4
HGNetv2:
  freeze_at: -1
  freeze_norm: false
  local_model_dir: weight/hgnetv2/
  name: B0
  pretrained: false
  return_idx:
  - 1
  - 2
  - 3
  use_lab: true
HybridEncoder:
  act: silu
  depth_mult: 0.34
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 0.5
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  in_channels:
  - 256
  - 512
  - 1024
  nhead: 8
  num_encoder_layers: 1
  use_encoder_idx:
  - 2
checkpoint_freq: 30
clip_max_norm: 0.1
criterion: DFINECriterion
ema:
  decay: 0.9999
  start: 0
  type: ModelEMA
  warmups: 100
epochs: 30
eval_spatial_size:
- 640
- 640
evaluator:
  iou_types:
  - bbox
  type: CocoEvaluator
exp_name: baseline
find_unused_parameters: false
lr_scheduler:
  gamma: 0.1
  milestones:
  - 24
  type: MultiStepLR
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 45
model: DFINE
num_classes: 1
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.0002
  params:
  - lr: 0.0001
    params: ^(?=.*backbone)(?!.*norm|bn).*$
  - lr: 0.0001
    params: ^(?=.*backbone)(?=.*norm|bn).*$
    weight_decay: 0.0
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  type: AdamW
  weight_decay: 0.0001
output_dir: outputs
postprocessor: DFINEPostProcessor
print_freq: 10
project_name: D-FINE
remap_mscoco_category: false
scaler:
  enabled: true
  type: GradScaler
sync_bn: false
task: detection
use_amp: false
use_ema: true
use_focal_loss: true
use_wandb: false
